server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Only the proxies named in HYPERVANE_TRUSTED_PROXIES may report a client's
    # address. Anyone else is taken at their connecting address, LAN clients
    # included, so they can't choose what the sign-in limits see.
    include /etc/nginx/trusted-proxies.conf;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Cookie $http_cookie;
        # The API limits sign-ins by client address, so it must come from here
        # and never from a header the client chose.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header True-Client-IP "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # ISOs and templates pass straight through to Proxmox. The API caps the
        # bodies it reads before sign-in.
        client_max_body_size 0;
        proxy_request_buffering off;
    }

    location /healthz {
        proxy_pass http://api:8080/healthz;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
