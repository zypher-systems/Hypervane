server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # A reverse proxy on a private network reports the real client here. Anyone
    # else is taken at their connecting address, so they can't forge one.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Cookie $http_cookie;
        # The API limits sign-ins by client address, so it must come from here
        # and never from a header the client chose.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header True-Client-IP "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # ISOs and templates pass straight through to Proxmox. The API caps the
        # bodies it reads before sign-in.
        client_max_body_size 0;
        proxy_request_buffering off;
    }

    location /healthz {
        proxy_pass http://api:8080/healthz;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
