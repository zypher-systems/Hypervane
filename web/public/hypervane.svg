<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#131e38" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>

    <!-- Cyan to Indigo Gradient -->
    <linearGradient id="vaneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Node Layer Gradients -->
    <linearGradient id="layerTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="layerMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Canvas -->
  <rect width="512" height="512" rx="108" fill="url(#bgGlow)" stroke="#1E293B" stroke-width="4"/>

  <!-- Lower Hypervisor Base Plane (Isometric) -->
  <path d="M 256 360 L 390 290 L 256 220 L 122 290 Z" 
        fill="url(#layerTop)" 
        stroke="#334155" 
        stroke-width="3" 
        stroke-linejoin="round"/>
  
  <path d="M 122 290 L 122 308 L 256 378 L 390 308 L 390 290 L 256 360 Z" 
        fill="#0F172A" 
        stroke="#1E293B" 
        stroke-width="2"/>

  <!-- Mid Virtualization Plane (Floating) -->
  <path d="M 256 300 L 366 242 L 256 185 L 146 242 Z" 
        fill="url(#layerMid)" 
        stroke="#00E5FF" 
        stroke-opacity="0.3" 
        stroke-width="2.5" 
        stroke-linejoin="round"/>

  <!-- Dynamic Core / Pulse Vector -->
  <g filter="url(#coreGlow)">
    <!-- Central Pivot Pin -->
    <circle cx="256" cy="242" r="7" fill="#00E5FF" />
    <circle cx="256" cy="242" r="16" fill="none" stroke="#00E5FF" stroke-opacity="0.4" stroke-width="2" />

    <!-- Directional Vane (North-East Vector Arrow) -->
    <path d="M 256 242 L 320 120 L 256 150 L 210 205 Z" 
          fill="url(#vaneGrad)" />

    <!-- Vane Counter-Balance Wing -->
    <path d="M 256 242 L 195 285 L 215 255 Z" 
          fill="#6366F1" 
          opacity="0.8" />
  </g>

  <!-- Accent Status Nodes on Layer Surface -->
  <circle cx="165" cy="285" r="3.5" fill="#10B981" />
  <circle cx="345" cy="285" r="3.5" fill="#00E5FF" />
  <circle cx="256" cy="330" r="3.5" fill="#6366F1" />
</svg>
