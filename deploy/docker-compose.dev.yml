services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hypervane
      POSTGRES_PASSWORD: hypervane
      POSTGRES_DB: hypervane
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hypervane -d hypervane"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../api
      dockerfile: Dockerfile.dev
    environment:
      DATABASE_URL: postgres://hypervane:hypervane@postgres:5432/hypervane?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      HYPERVANE_HTTP_ADDR: :8080
      HYPERVANE_COOKIE_SECURE: "false"
      HYPERVANE_MASTER_KEY: ${HYPERVANE_MASTER_KEY:-change-me-to-a-long-random-secret}
    volumes:
      - ../api:/app
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ../web
      dockerfile: Dockerfile.dev
    environment:
      VITE_PROXY_TARGET: http://api:8080
    volumes:
      - ../web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata_dev:
  web_node_modules:
